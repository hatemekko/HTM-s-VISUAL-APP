<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#171e23;color:#f6f3ed;font:14px system-ui}button{cursor:pointer;border:1px solid #ffffff35;background:#253039;color:white;border-radius:24px;padding:11px 18px}button:hover{background:#465047}button:focus-visible{outline:3px solid #d8b583}#stage{height:620px;position:relative;overflow:hidden;border-radius:16px}canvas{display:block;width:100%;height:100%}#bar{position:absolute;top:18px;left:18px;right:18px;display:flex;gap:8px;z-index:3;flex-wrap:wrap}#hint{position:absolute;bottom:16px;left:20px;right:20px;color:#ddd;background:#171e23cc;padding:10px;border-radius:8px;pointer-events:none}#photo{position:absolute;inset:0;display:none;background:#11191f;z-index:2}#photo img{width:100%;height:100%;object-fit:contain}#caption{position:absolute;bottom:0;left:0;right:0;padding:40px 22px 20px;background:linear-gradient(transparent,#000c)}#caption strong{font-size:21px}#nav{display:flex;gap:10px;align-items:center;justify-content:space-between}#strip{display:flex;gap:10px;overflow:auto;padding:16px 0}#strip button{flex:0 0 150px;padding:0;overflow:hidden;border-radius:10px;text-align:left;background:#222c33}#strip img{width:150px;height:90px;object-fit:cover}#strip span{display:block;padding:9px;font-size:12px}#status{position:absolute;top:46%;width:100%;text-align:center}#cams{max-width:220px;padding:10px;border-radius:20px;background:#253039;color:white;border:1px solid #ffffff35}#badge{position:absolute;right:18px;top:78px;background:#111b;padding:8px;border-radius:9px;z-index:1} @media(max-width:600px){#stage{height:540px}button{padding:9px 12px}#caption strong{font-size:16px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<div id="stage"><div id="status">Chargement de la maquette…</div><div id="bar"><button id="overview">Vue d’ensemble</button><button id="gallery">Parcourir les rendus</button><select id="cams" aria-label="Point de vue"><option value="">Caméras SketchUp</option></select><button id="full" aria-label="Plein écran">⛶</button></div><div id="badge">MAQUETTE 3D</div><div id="photo"><img id="render" alt="Rendu architectural"><div id="caption"><div id="nav"><button id="prev" aria-label="Vue précédente">←</button><div><strong id="title"></strong><div id="count"></div></div><button id="next" aria-label="Vue suivante">→</button></div></div></div><div id="hint">Glisser : tourner · Molette : zoomer · Clic droit : déplacer · Points dorés : rendus associés</div></div><div id="strip"></div>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script type="module">
const data=JSON.parse(document.getElementById('payload').textContent),$=id=>document.getElementById(id);let index=0, goCamera=null, reset=null;
const views=data.views||[];
function photo(i){if(!views.length)return;index=(i+views.length)%views.length;let v=views[index];$('render').src=v.src;$('render').alt=v.title;$('title').textContent=v.title;$('count').textContent=`${index+1} / ${views.length}`;$('photo').style.display='block';$('badge').style.display='none';$('hint').style.display='none';}
function hide(){$('photo').style.display='none';$('badge').style.display='block';$('hint').style.display='block';}
$('gallery').onclick=()=>photo(index);$('prev').onclick=()=>photo(index-1);$('next').onclick=()=>photo(index+1);$('overview').onclick=()=>{hide();reset?.()};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else $('stage').requestFullscreen?.().catch(()=>{})};
window.addEventListener('keydown',e=>{if(e.key==='Escape')hide();if($('photo').style.display==='block'){if(e.key==='ArrowRight')photo(index+1);if(e.key==='ArrowLeft')photo(index-1)}});
views.forEach((v,i)=>{let b=document.createElement('button'),im=document.createElement('img'),s=document.createElement('span');im.src=v.src;im.alt='';im.loading='lazy';s.textContent=v.title;b.append(im,s);b.onclick=()=>photo(i);$('strip').append(b)});
(data.cameras||[]).forEach(c=>{let o=document.createElement('option');o.value=c.id;o.textContent=c.name;$('cams').append(o)});
$('cams').onchange=()=>{let c=data.cameras.find(c=>c.id===$('cams').value);if(c){hide();goCamera?.(c)}};
try{
const THREE=await import('three'),{OrbitControls}=await import('three/addons/controls/OrbitControls.js'),{GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
const stage=$('stage'),scene=new THREE.Scene();scene.background=new THREE.Color('#202a32');const camera=new THREE.PerspectiveCamera(50,1,0.02,2000),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xfff5e1,0x617587,2.6));let light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(20,40,10);scene.add(light);
const raw=Uint8Array.from(atob(data.model),c=>c.charCodeAt(0));const gltf=await new GLTFLoader().parseAsync(raw.buffer,'');scene.add(gltf.scene);gltf.scene.traverse(o=>{if(o.isMesh){for(let m of [].concat(o.material)){m.side=THREE.DoubleSide;}}});
const bounds=new THREE.Box3().setFromObject(gltf.scene),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3()).length();
reset=()=>{camera.fov=50;camera.updateProjectionMatrix();camera.position.copy(center).add(new THREE.Vector3(size*.65,size*.55,size*.65));controls.target.copy(center);controls.update()};reset();
goCamera=c=>{camera.position.fromArray(c.position);controls.target.fromArray(c.target);camera.fov=c.fov||50;camera.updateProjectionMatrix();controls.update()};
const markers=[];views.forEach((v,i)=>{let c=data.cameras.find(c=>c.id===v.camera_id);if(!c)return;let mesh=new THREE.Mesh(new THREE.SphereGeometry(Math.max(size*.005,.12),16,12),new THREE.MeshBasicMaterial({color:0xe6b675,depthTest:false}));mesh.position.fromArray(c.position);mesh.renderOrder=10;mesh.userData.index=i;scene.add(mesh);markers.push(mesh)});
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let down=null;renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);let hit=ray.intersectObjects(markers)[0];if(hit)photo(hit.object.userData.index)});
new ResizeObserver(()=>{renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()}).observe(stage);$('status').style.display='none';renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
}catch(e){$('status').textContent='La 3D n’a pas pu se charger. Les rendus restent disponibles. Vérifiez WebGL et votre connexion.';console.error(e)}
</script></body></html>
